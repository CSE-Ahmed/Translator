<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahraa for Translations</title>
    <style>
        /* الوضع الفاتح - تدرجات هادئة مع لمسات تقنية */
        :root {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%);
            --container-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --accent-color: #0284c7; 
            --accent-hover: #0369a1;
            --output-bg: #f1f5f9;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --glow: 0 0 15px rgba(2, 132, 199, 0.3);
        }

        /* الوضع الداكن - مستوحى من الصورة التقنية */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #070e1a 0%, #0f172a 100%);
            --container-bg: rgba(15, 23, 42, 0.7);
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --accent-color: #00e5ff; /* السماوي الساطع من الصورة */
            --accent-hover: #00b8cc;
            --output-bg: rgba(7, 14, 26, 0.6);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.3s ease;
        }
        
        .container {
            background-color: var(--container-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 30px;
            width: 100%;
            max-width: 950px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            color: var(--accent-color);
            text-shadow: var(--glow);
            letter-spacing: 1px;
        }

        .theme-toggle {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
            color: #070e1a;
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        select {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--output-bg);
            color: var(--text-color);
            font-size: 16px;
            font-weight: 500;
            width: 48%;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--accent-color);
            box-shadow: var(--glow);
        }

        .text-areas {
            display: flex;
            gap: 25px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 18px;
            border: 1px solid var(--border-color);
            background-color: var(--output-bg);
            color: var(--text-color);
            border-radius: 12px;
            font-size: 18px;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: var(--glow);
        }
        
        #outputText {
            border-color: transparent;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Zahraa Translator</h1>
            <button id="themeToggle" class="theme-toggle">
                ☀️ Light Mode
            </button>
        </div>

        <div class="controls">
            <select id="sourceLang">
                <option value="Autodetect" selected>Detect Language</option>
                <option value="en">English</option>
                <option value="ar">Arabic</option>
                <option value="fr">French</option>
                <option value="it">Italian</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
            </select>
            
            <select id="targetLang">
                <option value="ar" selected>Arabic</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="it">Italian</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
            </select>
        </div>

        <div class="text-areas">
            <textarea id="inputText" placeholder="Enter Text to translate...."></textarea>
            <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        const themeToggle = document.getElementById('themeToggle');
        
        let typingTimer;                
        const doneTypingInterval = 700; 

        // منطق تبديل الوضع
        themeToggle.addEventListener('click', () => {
            const htmlElement = document.documentElement;
            const currentTheme = htmlElement.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                htmlElement.setAttribute('data-theme', 'light');
                themeToggle.innerHTML = '🌙 Dark Mode';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                themeToggle.innerHTML = '☀️ Light Mode';
            }
        });

        const languageNames = {
            'en': 'English',
            'ar': 'Arabic',
            'fr': 'French',
            'it': 'Italian',
            'de': 'German',
            'es': 'Spanish'
        };

        async function translateText() {
            const textToTranslate = inputText.value;
            const source = sourceLang.value;
            const target = targetLang.value;

            if (textToTranslate.trim() === "") {
                outputText.value = "";
                sourceLang.options[0].text = "Detect Language"; 
                return;
            }

            outputText.value = "Translating...";

            try {
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(textToTranslate)}&langpair=${source}|${target}&de=test@example.com`;
                
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Server Error: ${response.status}`);
                }

                const data = await response.json();

                if (data.responseStatus === 403) {
                    outputText.value = "Daily translation limit exceeded. Please try again tomorrow.";
                    return;
                }

                if (data.responseData && data.responseData.translatedText) {
                    outputText.value = data.responseData.translatedText;
                    
                    if (source === 'Autodetect') {
                        let detectedCode = null;

                        if (data.matches && Array.isArray(data.matches)) {
                            const validMatch = data.matches.find(m => 
                                typeof m.source === 'string' && 
                                m.source.toLowerCase() !== 'autodetect'
                            );
                            
                            if (validMatch) {
                                detectedCode = validMatch.source.split('-')[0].toLowerCase();
                            }
                        }

                        if (detectedCode && languageNames[detectedCode]) {
                            sourceLang.options[0].text = `Detected: ${languageNames[detectedCode]}`;
                        } else {
                            sourceLang.options[0].text = "Detect Language"; 
                        }
                    }
                } else {
                    outputText.value = "Sorry, we couldn't fetch the translation.";
                }
            } catch (error) {
                console.error("Error details:", error);
                outputText.value = "Connection failed. Please check your internet or ad-blocker.";
            }
        }

        inputText.addEventListener('input', () => {
            clearTimeout(typingTimer); 
            typingTimer = setTimeout(() => {
                translateText(); 
            }, doneTypingInterval);
        });

        sourceLang.addEventListener('change', () => {
            sourceLang.options[0].text = "Detect Language";
            translateText();
        });
        
        targetLang.addEventListener('change', translateText);

    </script>
</body>
</html>
